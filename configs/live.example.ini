[platform]
mode=live

[live]
environment=sim
poll_interval_ms=1000
iterations=0
dry_run=true

[account.ctp_demo]
front=${ITRADER_TRADER_FRONT}
md_front=${ITRADER_MD_FRONT}
broker_id=${ITRADER_BROKER_ID}
user_id=${ITRADER_USER_ID}
investor_id=${ITRADER_INVESTOR_ID}
password=${ITRADER_PASSWORD}
app_id=${ITRADER_APP_ID}
auth_code=${ITRADER_AUTH_CODE}
product_info=${ITRADER_PRODUCT_INFO:-iTrader}
flow_dir=
md_flow_dir=
production_mode=false
reconnect_enabled=true
reconnect_retry_interval_ms=3000
reconnect_max_attempts=0
initial_cash=0

[strategy.noop_probe]
accounts=ctp_demo
dll=../build/Debug/noop_strategy.dll
instruments=${ITRADER_INSTRUMENT:-ag2606}
order_ref_strategy_code=01
