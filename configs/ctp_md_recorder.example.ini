[platform]
mode=ctp_md_recorder

[recorder]
output_dir=../runtime/ctp_md_recorder/agtick
instruments=${ITRADER_RECORDER_INSTRUMENTS:-ag2606}
flush_interval_ms=1000
status_interval_ms=30000
idle_sleep_ms=250
connect_timeout_ms=15000
deduplicate_exact_ticks=true
auto_restart_enabled=true

[account.recorder]
md_front=${ITRADER_RECORDER_MD_FRONT}
md_broker_id=${ITRADER_RECORDER_BROKER_ID}
md_user_id=${ITRADER_RECORDER_USER_ID}
md_password=${ITRADER_RECORDER_PASSWORD}
product_info=${ITRADER_PRODUCT_INFO:-iTrader}
production_mode=false
reconnect_enabled=true
reconnect_retry_interval_ms=3000
reconnect_max_attempts=0
